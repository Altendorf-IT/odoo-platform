# Reusable submodule watcher (called from product repos).
#
# By default watches EVERY submodule declared in the product's .gitmodules and
# checks each against the tip of its tracked branch (the `branch =` line). Any
# that moved are bundled into ONE fixed branch, (force-)pushed, and surfaced as
# a single PR that a human merges (= ship) or closes (= veto). No PR spam — new
# upstream commits just refresh the same PR.
#
# Fail-soft: a submodule we cannot fetch (a private repo the token can't reach,
# or a transient network error) is logged as a warning and skipped; the run
# still bumps every submodule it CAN reach. The job only fails on a real error
# in the push / PR step.
#
# Caller contract — add .github/workflows/watch-submodules.yml to the product
# repo on a schedule + workflow_dispatch trigger. NOTE: scheduled runs only
# fire from the file on the repo's DEFAULT branch.
#
#   jobs:
#     bump:
#       uses: <owner>/odoo-platform/.github/workflows/bump-submodules.yml@19.0
#       secrets:
#         BUMP_TOKEN: ${{ secrets.SUBMODULE_BUMP_PAT }}
#
# Optionally pass `with: { paths: "a b c" }` to watch only specific submodules.
#
# BUMP_TOKEN: fine-grained PAT with Contents read+write and Pull requests
# read+write on the product repo, plus Contents read on any PRIVATE submodule
# repo you want bumped. Public submodules (e.g. OCA) need no extra grant; a
# private one the token can't read is simply skipped.
name: Bump submodules

on:
  workflow_call:
    inputs:
      paths:
        description: >-
          Whitespace-separated submodule paths to watch. Empty (the default)
          auto-discovers every submodule in .gitmodules.
        required: false
        type: string
        default: ""
      pr_branch:
        description: Fixed branch name used for the bump PR
        required: false
        type: string
        default: auto/bump-submodules
    secrets:
      BUMP_TOKEN:
        required: true

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.BUMP_TOKEN }}
          # persist-credentials (default true) stores the token for github.com,
          # so fetching private same-account submodules (relative URLs) works.

      - name: Update watched submodules to their branch tips
        id: update
        env:
          PATHS_IN: ${{ inputs.paths }}
          BUMP_TOKEN: ${{ secrets.BUMP_TOKEN }}
        run: |
          set -eu
          git config user.name "submodule-bump[bot]"
          git config user.email "submodule-bump@users.noreply.github.com"

          # Authenticate EVERY github.com fetch, including submodule fetches.
          # The checkout action only stores the token on the superproject's
          # config; submodule fetches run in their own context and don't inherit
          # it, so a PRIVATE submodule would prompt for a username and fail.
          # A global insteadOf rewrite embeds the token in the URL so it applies
          # everywhere (never written to any committed file). Masked in logs.
          if [ -n "${BUMP_TOKEN:-}" ]; then
            git config --global \
              url."https://x-access-token:${BUMP_TOKEN}@github.com/".insteadOf \
              "https://github.com/"
          fi

          # .gitmodules may mark submodules `shallow = true`. A shallow clone
          # has no refs/remotes/origin/<branch> for `--remote` to resolve (fatal
          # "Unable to find ... revision") and hides the old..new changelog.
          # Neutralize it for this run only (this edit is never committed).
          git config -f .gitmodules --get-regexp '\.shallow$' 2>/dev/null \
            | awk '{print $1}' \
            | while read -r k; do git config -f .gitmodules --unset "$k" || true; done

          # Which submodules? An explicit list, else every path in .gitmodules.
          paths="$PATHS_IN"
          if [ -z "${paths// /}" ]; then
            paths=$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' \
                      | awk '{print $2}' || true)
          fi
          if [ -z "${paths// /}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No submodules found to watch."
            exit 0
          fi

          summary=""
          skipped=""
          changed_paths=""
          for path in $paths; do
            # Not a real submodule pointer? Warn and move on.
            if ! old=$(git rev-parse "HEAD:$path" 2>/dev/null); then
              echo "::warning::'$path' is not a submodule pointer — skipping"
              skipped="$skipped $path"
              continue
            fi
            # Fetch failure (private repo w/o access, network) is non-fatal.
            if ! err=$(git submodule update --init --remote -- "$path" 2>&1); then
              reason=$(printf '%s\n' "$err" | grep -iE 'denied|authentication|not found|403|401|could not read|remote branch|fatal' | head -1)
              echo "::warning::could not fetch '$path' — skipping (${reason:-see log below})"
              echo "$err"
              skipped="$skipped $path"
              continue
            fi
            new=$(git -C "$path" rev-parse HEAD)
            if [ "$old" != "$new" ]; then
              changed_paths="$changed_paths $path"
              log=$(git -C "$path" log --oneline "$old..$new" 2>/dev/null || echo "(history unavailable)")
              summary="$summary### \`$path\` \`${old:0:9}\` → \`${new:0:9}\`
          \`\`\`
          $log
          \`\`\`
          "
            fi
          done

          if [ -n "${skipped// /}" ]; then
            echo "Skipped (unreachable):$skipped"
          fi
          if [ -z "$summary" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "All reachable submodules already at branch tip."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "changed_paths=$changed_paths"
            echo "summary<<SUMMARY_EOF"
            echo "$summary"
            echo "SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Push bump branch and open/refresh PR
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN }}
          BRANCH: ${{ inputs.pr_branch }}
          BASE: ${{ github.ref_name }}
          SUMMARY: ${{ steps.update.outputs.summary }}
          CHANGED_PATHS: ${{ steps.update.outputs.changed_paths }}
        run: |
          set -eu
          git checkout -B "$BRANCH"
          git add -- $CHANGED_PATHS
          git commit -m "chore: bump submodule pointer(s) to branch tip"
          git push -f origin "$BRANCH"
          body="Automated submodule pointer bump — merging this is what deploys it; close to veto.

          $SUMMARY
          _Refreshed automatically whenever a watched branch moves again._"
          existing=$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body "$body"
            echo "Updated existing PR #$existing"
          else
            gh pr create --base "$BASE" --head "$BRANCH" \
              --title "Bump submodules to latest" --body "$body"
          fi
