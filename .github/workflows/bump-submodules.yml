# Reusable submodule watcher (called from product repos).
#
# By default watches EVERY submodule declared in the product's .gitmodules and
# checks each against the tip of its tracked branch (the `branch =` line). Any
# that moved are bundled into ONE fixed branch, (force-)pushed, and surfaced as
# a single PR that a human merges (= ship) or closes (= veto). No PR spam — new
# upstream commits just refresh the same PR.
#
# Fail-soft: a submodule we cannot fetch (a private repo the token can't reach,
# or a transient network error) is logged as a warning and skipped; the run
# still bumps every submodule it CAN reach. The job only fails on a real error
# in the push / PR step.
#
# Caller contract — add .github/workflows/watch-submodules.yml to the product
# repo on a schedule + workflow_dispatch trigger. NOTE: scheduled runs only
# fire from the file on the repo's DEFAULT branch.
#
#   jobs:
#     bump:
#       uses: <owner>/odoo-platform/.github/workflows/bump-submodules.yml@19.0
#       with:
#         app_id: ${{ vars.SUBMODULE_BUMP_APP_ID }}
#       secrets:
#         APP_PRIVATE_KEY: ${{ secrets.SUBMODULE_BUMP_APP_PRIVATE_KEY }}
#
# Optionally pass `with: { paths: "a b c" }` to watch only specific submodules.
#
# Core image: a product with a committed `odoo-core.yml` pinned by digest
# (`ODOO_IMAGE: odoo:19.0@sha256:...`) is also checked against Docker Hub. When
# the tag in that line now has another index digest, the line (and the dated
# tag comment above it) is rewritten on a SEPARATE fixed branch
# (auto/bump-core) and PR, never mixed into the submodule PR: a core bump
# upgrades most of the database. Unpinned products and other registries are
# skipped; a registry error is a warning, never a failure.
#
# Auth (preferred): a GitHub App. The workflow mints a short-lived installation
# token with actions/create-github-app-token, scoped to the whole owner
# (organization) so it can also read private submodule repos. The App needs
# repository permissions Contents read+write, Pull requests read+write
# (Metadata read is implicit) and must be installed on the product repo and on
# every PRIVATE submodule repo. Public submodules (e.g. OCA) need no grant; a
# private one the App can't read is simply skipped. Bump commits are authored
# by the App's bot (<slug>[bot]).
#
# Fallback (legacy): secret BUMP_TOKEN, a PAT with the same access. Used only
# when no App key is passed. Org-owned repos can't use fine-grained PATs
# across repos, which is why the App is preferred.
name: Bump submodules

on:
  workflow_call:
    inputs:
      paths:
        description: >-
          Whitespace-separated submodule paths to watch. Empty (the default)
          auto-discovers every submodule in .gitmodules.
        required: false
        type: string
        default: ""
      pr_branch:
        description: Fixed branch name used for the bump PR
        required: false
        type: string
        default: auto/bump-submodules
      core_pr_branch:
        description: Fixed branch name used for the core image bump PR
        required: false
        type: string
        default: auto/bump-core
      app_id:
        description: >-
          GitHub App ID (or client ID) for the bump App. Not secret; pass a
          repo/org variable. Used together with the APP_PRIVATE_KEY secret.
        required: false
        type: string
        default: ""
    secrets:
      APP_PRIVATE_KEY:
        description: Private key (PEM) of the bump GitHub App.
        required: false
      BUMP_TOKEN:
        description: Legacy PAT fallback, used only when no App key is passed.
        required: false

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      HAVE_APP: ${{ inputs.app_id != '' && secrets.APP_PRIVATE_KEY != '' }}
    steps:
      - name: Mint GitHub App installation token
        id: app
        if: env.HAVE_APP == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app_id }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          # Whole owner, not just this repo: needed to read private submodules.
          owner: ${{ github.repository_owner }}

      - name: Pick token and commit identity
        id: auth
        env:
          APP_TOKEN: ${{ steps.app.outputs.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          LEGACY_TOKEN: ${{ secrets.BUMP_TOKEN }}
        run: |
          set -eu
          if [ -n "${APP_TOKEN:-}" ]; then
            token="$APP_TOKEN"
            name="${APP_SLUG}[bot]"
            id=$(GH_TOKEN="$token" gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
            email="${id}+${name}@users.noreply.github.com"
          elif [ -n "${LEGACY_TOKEN:-}" ]; then
            token="$LEGACY_TOKEN"
            name="submodule-bump[bot]"
            email="submodule-bump@users.noreply.github.com"
          else
            echo "::error::No credentials: pass app_id + APP_PRIVATE_KEY (preferred) or BUMP_TOKEN"
            exit 1
          fi
          echo "::add-mask::$token"
          {
            echo "token=$token"
            echo "name=$name"
            echo "email=$email"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          token: ${{ steps.auth.outputs.token }}
          # persist-credentials (default true) stores the token for github.com,
          # so fetching private same-account submodules (relative URLs) works.

      - name: Update watched submodules to their branch tips
        id: update
        env:
          PATHS_IN: ${{ inputs.paths }}
          BUMP_TOKEN: ${{ steps.auth.outputs.token }}
          GIT_NAME: ${{ steps.auth.outputs.name }}
          GIT_EMAIL: ${{ steps.auth.outputs.email }}
        run: |
          set -eu
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"

          # Authenticate EVERY github.com fetch, including submodule fetches.
          # The checkout action only stores the token on the superproject's
          # config; submodule fetches run in their own context and don't inherit
          # it, so a PRIVATE submodule would prompt for a username and fail.
          # A global insteadOf rewrite embeds the token in the URL so it applies
          # everywhere (never written to any committed file). Masked in logs.
          if [ -n "${BUMP_TOKEN:-}" ]; then
            git config --global \
              url."https://x-access-token:${BUMP_TOKEN}@github.com/".insteadOf \
              "https://github.com/"
          fi

          # .gitmodules may mark submodules `shallow = true`. A shallow clone
          # has no refs/remotes/origin/<branch> for `--remote` to resolve (fatal
          # "Unable to find ... revision") and hides the old..new changelog.
          # Neutralize it for this run only (this edit is never committed).
          git config -f .gitmodules --get-regexp '\.shallow$' 2>/dev/null \
            | awk '{print $1}' \
            | while read -r k; do git config -f .gitmodules --unset "$k" || true; done

          # Which submodules? An explicit list, else every path in .gitmodules.
          paths="$PATHS_IN"
          if [ -z "${paths// /}" ]; then
            paths=$(git config -f .gitmodules --get-regexp '^submodule\..*\.path$' \
                      | awk '{print $2}' || true)
          fi
          if [ -z "${paths// /}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No submodules found to watch."
            exit 0
          fi

          summary=""
          skipped=""
          changed_paths=""
          for path in $paths; do
            # Not a real submodule pointer? Warn and move on.
            if ! old=$(git rev-parse "HEAD:$path" 2>/dev/null); then
              echo "::warning::'$path' is not a submodule pointer — skipping"
              skipped="$skipped $path"
              continue
            fi
            # Fetch failure (private repo w/o access, network) is non-fatal.
            if ! err=$(git submodule update --init --remote -- "$path" 2>&1); then
              reason=$(printf '%s\n' "$err" | grep -iE 'denied|authentication|not found|403|401|could not read|remote branch|fatal' | head -1)
              echo "::warning::could not fetch '$path' — skipping (${reason:-see log below})"
              echo "$err"
              skipped="$skipped $path"
              continue
            fi
            new=$(git -C "$path" rev-parse HEAD)
            if [ "$old" != "$new" ]; then
              changed_paths="$changed_paths $path"
              log=$(git -C "$path" log --oneline "$old..$new" 2>/dev/null || echo "(history unavailable)")
              summary="$summary### \`$path\` \`${old:0:9}\` → \`${new:0:9}\`
          \`\`\`
          $log
          \`\`\`
          "
            fi
          done

          if [ -n "${skipped// /}" ]; then
            echo "Skipped (unreachable):$skipped"
          fi
          if [ -z "$summary" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "All reachable submodules already at branch tip."
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "changed_paths=$changed_paths"
            echo "summary<<SUMMARY_EOF"
            echo "$summary"
            echo "SUMMARY_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Push bump branch and open/refresh PR
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          BRANCH: ${{ inputs.pr_branch }}
          BASE: ${{ github.ref_name }}
          SUMMARY: ${{ steps.update.outputs.summary }}
          CHANGED_PATHS: ${{ steps.update.outputs.changed_paths }}
        run: |
          set -eu
          git checkout -B "$BRANCH"
          git add -- $CHANGED_PATHS
          git commit -m "chore: bump submodule pointer(s) to branch tip"
          git push -f origin "$BRANCH"
          body="Automated submodule pointer bump — merging this is what deploys it; close to veto.

          $SUMMARY
          _Refreshed automatically whenever a watched branch moves again._"
          existing=$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body "$body"
            echo "Updated existing PR #$existing"
          else
            gh pr create --base "$BASE" --head "$BRANCH" \
              --title "Bump submodules to latest" --body "$body"
          fi

      # --- Core image (odoo-core.yml) -------------------------------------
      # Runs after the submodule steps on a branch of its own from the
      # checked-out commit; only odoo-core.yml is ever staged here.
      - name: Check the core pin against Docker Hub
        id: core
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          BRANCH: ${{ inputs.core_pr_branch }}
        run: |
          set -eu
          if [ ! -f odoo-core.yml ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No odoo-core.yml: core image not watched."
            exit 0
          fi
          git checkout -q -f -B "$BRANCH" "$GITHUB_SHA"
          python3 - <<'PY'
          import json, os, re, sys, urllib.request

          out = open(os.environ["GITHUB_OUTPUT"], "a")

          def finish(msg, **kv):
              print(msg)
              kv.setdefault("changed", "false")
              for k, v in kv.items():
                  out.write(f"{k}={v}\n")
              sys.exit(0)

          def hub(url):
              req = urllib.request.Request(url, headers={"User-Agent": "odoo-platform-bump"})
              with urllib.request.urlopen(req, timeout=30) as res:
                  return json.load(res)

          path = "odoo-core.yml"
          lines = open(path).read().splitlines(keepends=True)
          rows = [i for i, l in enumerate(lines) if re.match(r"\s*ODOO_IMAGE:\s*\S", l)]
          if not rows:
              finish("odoo-core.yml has no ODOO_IMAGE line: skipped.")
          i = rows[-1]
          indent, ref = re.match(r"(\s*)ODOO_IMAGE:\s*([^\s#]+)", lines[i]).groups()
          if "@sha256:" not in ref or "$" in ref:
              finish(f"Core not pinned by digest ({ref}): skipped.")
          name, old = ref.split("@", 1)
          repo, tag = (name.rsplit(":", 1) if ":" in name.rsplit("/", 1)[-1] else (name, "latest"))
          first = repo.split("/")[0]
          if "/" in repo and ("." in first or ":" in first or first == "localhost"):
              finish(f"{name} is not on Docker Hub: skipped.")
          if "/" not in repo:
              repo = f"library/{repo}"
          api = f"https://hub.docker.com/v2/repositories/{repo}/tags"
          try:
              new = hub(f"{api}/{tag}").get("digest") or ""
          except Exception as exc:
              print(f"::warning::Docker Hub lookup of {name} failed: {exc}")
              finish("Core check skipped.")
          if not new.startswith("sha256:"):
              print(f"::warning::Docker Hub returned no digest for {name}")
              finish("Core check skipped.")
          if new == old:
              finish(f"{name} is still {old}: core pin current.")
          dated = ""
          try:
              for t in hub(f"{api}?page_size=100&ordering=last_updated&name={tag}-").get("results", []):
                  if t.get("digest") == new and t.get("name") != tag:
                      dated = t["name"]
                      break
          except Exception as exc:
              print(f"::warning::Docker Hub tag list for {name} failed: {exc}")
          label = dated or f"{tag} (no dated tag found)"
          comment = f"{indent}# {label}\n"
          if i and re.match(r"\s*#\s*" + re.escape(tag) + r"(-\d{8})?(\s|$)", lines[i - 1]):
              lines[i - 1] = comment
          else:
              lines.insert(i, comment)
              i += 1
          lines[i] = f"{indent}ODOO_IMAGE: {name}@{new}\n"
          open(path, "w").write("".join(lines))
          finish(f"{name}: {old} -> {new} ({label})",
                 changed="true", image=name, old=old, new=new, label=label)
          PY

      - name: Push core bump branch and open/refresh PR
        if: ${{ !cancelled() && steps.core.outputs.changed == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.auth.outputs.token }}
          BRANCH: ${{ inputs.core_pr_branch }}
          BASE: ${{ github.ref_name }}
          IMAGE: ${{ steps.core.outputs.image }}
          OLD: ${{ steps.core.outputs.old }}
          NEW: ${{ steps.core.outputs.new }}
          LABEL: ${{ steps.core.outputs.label }}
        run: |
          set -eu
          git add -- odoo-core.yml
          git commit -m "chore: bump the Odoo core to $LABEL"
          git push -f origin "$BRANCH"
          body="Automated Odoo core bump: \`$IMAGE\` now has another index digest on Docker Hub.

          - old: \`$OLD\`
          - new: \`$NEW\` (\`$LABEL\`)

          **Read before merging. Merging deploys it.**

          - A core bump upgrades most of the database: the hashes of the core addons change and the first boot upgrades them all. Expect about 1 minute of extra downtime on that deploy.
          - There is no rollback without a database backup. A database upgraded on the new core need not boot on the old core (Nov 2026: \`res.company\` \`tz\`). Reverting this commit alone does not help. Take a backup first.
          - Run a FULL-tier rehearsal of this branch before merging (\`tools/rehearse.sh --tier full\`).

          Close to veto. _Refreshed automatically when the tag moves again._"
          existing=$(gh pr list --head "$BRANCH" --base "$BASE" --state open --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "Bump Odoo core to $LABEL" --body "$body"
            echo "Updated existing PR #$existing"
          else
            gh pr create --base "$BASE" --head "$BRANCH" \
              --title "Bump Odoo core to $LABEL" --body "$body"
          fi
