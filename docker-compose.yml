# Production / Dokploy stack: Odoo 19 + PostgreSQL.
#
# This file lives in the odoo-platform SUBMODULE and is consumed from a product
# repo root via the product's thin docker-compose.yml:
#
#   include:
#     - path: platform/docker-compose.yml
#       project_directory: .
#
# => ALL relative paths in this file resolve against the PRODUCT repo root.
#
# Local dev conveniences (published ports, live code mount, reload) live in
# platform/docker-compose.override.yml — the platform Makefile's dev targets
# add it explicitly; Dokploy never sees it.
#
# All tunables come from the product's .env (see its .env.example).

# Nightly encrypted off-site backup (pg_dump + filestore -> age -> SFTP).
# The `backup` service starts with every stack. Without BACKUP_DBS it logs
# "backup: off, BACKUP_DBS is not set" and idles; set the BACKUP_* variables in
# the product's .env (Dokploy -> Environment) to turn the nightly job on. No
# overlay file and no profile: Dokploy runs compose with one explicit -f (so
# COMPOSE_FILE never loads) and does not apply COMPOSE_PROFILES. Setup,
# variables and the restore runbook: platform/DEPLOY.md, "Backups".
x-backup: &backup
  build:
    context: ./platform/backup
  image: ${IMAGE_NAME:-odoo-product}-backup:${IMAGE_TAG:-latest}
  pull_policy: build
  depends_on:
    db:
      condition: service_healthy
  environment:
    PGHOST: db
    PGPORT: 5432
    PGUSER: ${DB_USER:-odoo}
    PGPASSWORD: ${DB_PASSWORD:-odoo}
    BACKUP_DBS: ${BACKUP_DBS:-}
    BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-30 2 * * *}
    BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-50}
    BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
    BACKUP_SFTP_HOST: ${BACKUP_SFTP_HOST:-}
    BACKUP_SFTP_PORT: ${BACKUP_SFTP_PORT:-22}
    BACKUP_SFTP_USER: ${BACKUP_SFTP_USER:-}
    BACKUP_SFTP_PASSWORD: ${BACKUP_SFTP_PASSWORD:-}
    BACKUP_SFTP_DIR: ${BACKUP_SFTP_DIR:-}
    BACKUP_SFTP_HOST_KEY: ${BACKUP_SFTP_HOST_KEY:-}
    BACKUP_PING_URL: ${BACKUP_PING_URL:-}

services:
  db:
    image: postgres:16
    restart: unless-stopped
    # Postgres tuning (defaults sized for ~2GB RAM dedicated to Postgres; bump
    # via .env on bigger boxes, e.g. PG_SHARED_BUFFERS=2GB for ~8GB).
    # Rule of thumb: shared_buffers ~= 25% of the RAM given to Postgres,
    # effective_cache_size ~= 50-75%. Scale via .env per deployment.
    #
    # dynamic_shared_memory_type=sysv, not the `posix` default. Postgres creates
    # a DSM *control segment* at postmaster start and EVERY backend attaches to
    # it while connecting. Under `posix` that segment is a file in /dev/shm; if
    # anything removes it while the postmaster keeps running, the postmaster goes
    # on handing out the dead name and every new connection dies with
    #   FATAL: could not open shared memory segment "/PostgreSQL.<n>":
    #          No such file or directory
    # — the same <n> over and over, until the postmaster is restarted. It cannot
    # recover on its own. `sysv` keeps the segment in kernel IPC instead of a
    # tmpfs file, so there is no file for anything to delete. Note this is NOT
    # fixed by disabling parallel query: the control segment exists regardless.
    command: >
      postgres
      -c shared_buffers=${PG_SHARED_BUFFERS:-512MB}
      -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-1536MB}
      -c work_mem=${PG_WORK_MEM:-8MB}
      -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-64MB}
      -c max_connections=${PG_MAX_CONNECTIONS:-100}
      -c dynamic_shared_memory_type=${PG_DYNAMIC_SHARED_MEMORY_TYPE:-sysv}
      -c max_parallel_workers_per_gather=${PG_MAX_PARALLEL_WORKERS_PER_GATHER:-0}
    # Docker's default /dev/shm is 64MB. Only used when PG_DYNAMIC_SHARED_MEMORY_TYPE
    # is put back to `posix`, but tmpfs is lazily allocated so a larger size costs
    # nothing until something writes to it.
    shm_size: ${PG_SHM_SIZE:-256mb}
    # Hard ceiling so a runaway query cannot get the HOST OOM killer involved.
    # With no limit the kernel picks its own victim anywhere on the box — which
    # is how a postmaster gets killed by a memory spike in a different stack.
    deploy:
      resources:
        limits:
          memory: ${DB_MEM_LIMIT:-2g}
    environment:
      POSTGRES_USER: ${DB_USER:-odoo}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-odoo}
      POSTGRES_DB: postgres            # maintenance db; Odoo creates ${DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db-data:/var/lib/postgresql/data
    # No `ports:` on purpose — prod publishes nothing. To expose Postgres for a
    # one-off remote restore, opt in via docker-compose.dangerously-expose-db.yml
    # (see DEPLOY.md "Dangerously exposed ports"). A `ports:` entry here would
    # publish on EVERY deployment; there is no "off" value for one.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-odoo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  odoo:
    build:
      context: .                       # product repo root
      dockerfile: platform/Dockerfile
      args:
        ODOO_IMAGE: ${ODOO_IMAGE:-odoo:19.0}
        INSTALL_VENDOR_REQS: ${INSTALL_VENDOR_REQS:-1}
        # Apt mirror override for hosts with a bad path to Canonical
        # (e.g. https://mirror.23m.com/ubuntu). Empty = upstream.
        APT_MIRROR: ${APT_MIRROR:-}
        # Bake OpenUpgrade into the image (inert unless OPENUPGRADE=1 at runtime).
        OPENUPGRADE: ${OPENUPGRADE_BUILD:-1}
    image: ${IMAGE_NAME:-odoo-product}:${IMAGE_TAG:-latest}
    pull_policy: build          # local build image — never try to pull from a registry
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-odoo}
      DB_PASSWORD: ${DB_PASSWORD:-odoo}
      DB_NAME: ${DB_NAME:-False}
      # Per-PROCESS connection pool cap. Every http worker and every cron worker
      # holds its own pool, so the cluster must have headroom for roughly
      # (WORKERS + MAX_CRON_THREADS + 1) * DB_MAXCONN connections. Odoo's own
      # default of 64 blows past PG_MAX_CONNECTIONS the moment workers > 1.
      DB_MAXCONN: ${DB_MAXCONN:-16}
      DBFILTER: ${DBFILTER:-}   # host->db routing; multi-db needs (?i)^%d$ (DEPLOY.md)
      LIST_DB: ${LIST_DB:-False}
      ADMIN_PASSWD: ${ADMIN_PASSWD:-admin}
      HTTP_PORT: ${HTTP_PORT:-8069}
      GEVENT_PORT: ${GEVENT_PORT:-8072}
      PROXY_MODE: ${PROXY_MODE:-True}
      WORKERS: ${WORKERS:-2}
      MAX_CRON_THREADS: ${MAX_CRON_THREADS:-1}
      # --- Worker recycling ---------------------------------------------------
      # SOFT is the setting that actually controls memory: past it the worker
      # finishes its request and exits, and the master respawns it.
      #
      # THE FLOOR IS NOT ZERO. Odoo loads the registry in the master and THEN
      # forks, and psutil counts shared pages, so a brand-new worker already
      # reports the master's whole RSS as its own — roughly 500-700MB for a
      # large addons set. Set SOFT below that and every worker dies before its
      # first request, in an endless respawn loop that logs
      #   Worker (<pid>) alive
      #   Worker (<pid>) virtual memory limit (<n>) reached.
      #   Worker (<pid>) exiting. request_count: 0
      # Measure the floor before lowering this:
      #   docker stats --no-stream   (or ps -o rss= -p <worker pid>)
      # and leave real working headroom above it. Note the message says
      # "virtual memory" but prints VMS while comparing RSS — size against RSS.
      #
      # Conversely, do NOT budget (WORKERS + MAX_CRON_THREADS) * SOFT of real
      # RAM: those inherited pages are copy-on-write and shared between workers,
      # so the sum badly overcounts. ODOO_MEM_LIMIT below is the honest number —
      # a cgroup counts a shared page once.
      #
      # HARD is an RLIMIT_AS crash guard on virtual address space, which runs
      # well above RSS, so it stays generous — a tight value turns big PDF/xlsx
      # exports into MemoryError. LIMIT_REQUEST recycles on request count and is
      # the backstop for slow leaks that never trip SOFT; Odoo's ~65k default is
      # already high, and a value in the billions disables recycling outright.
      LIMIT_MEMORY_SOFT: ${LIMIT_MEMORY_SOFT:-1342177280}     # 1.25 GiB
      LIMIT_MEMORY_HARD: ${LIMIT_MEMORY_HARD:-2684354560}     # 2.5 GiB
      LIMIT_REQUEST: ${LIMIT_REQUEST:-8192}
      LIMIT_TIME_CPU: ${LIMIT_TIME_CPU:-300}
      LIMIT_TIME_REAL: ${LIMIT_TIME_REAL:-600}
      # Cron jobs get their OWN wall-clock cap. Odoo's default (-1) reuses
      # LIMIT_TIME_REAL, which is sized for an HTTP request — a nightly backup
      # or recompute that overruns it is killed mid-transaction and rolled back,
      # so ir_cron.nextcall never advances and the job is stuck overdue forever,
      # starving every cron queued behind it. 0 = no limit.
      LIMIT_TIME_REAL_CRON: ${LIMIT_TIME_REAL_CRON:--1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Secrets at rest (OCA data_encryption). Generate the key with:
      #   python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      # Keep it in a password manager: losing it makes stored secrets unreadable.
      RUNNING_ENV: ${RUNNING_ENV:-}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      INSTALL_MODULES: ${INSTALL_MODULES:-}
      # Product-specific: set in the product's .env (no platform default).
      UPGRADE_MODULES: ${UPGRADE_MODULES:-}
      ODOO_ADMIN_PASSWORD: ${ODOO_ADMIN_PASSWORD:-admin}
      UPGRADE_DB: ${UPGRADE_DB:-}
      INIT_DB: ${INIT_DB:-}
      # One-time major-version migration of the UPGRADE_DB databases on boot
      # (OpenUpgrade, then a plain reload, then INSTALL_MODULES). See the
      # OPENUPGRADE block in platform/docker/entrypoint.sh and DEPLOY.md.
      OPENUPGRADE: ${OPENUPGRADE:-}
      # Rehearsal/port stacks only: load only modules already ported to this
      # series. Never in production (see entrypoint.sh).
      ADDONS_SKIP_UNPORTED: ${ADDONS_SKIP_UNPORTED:-}
      # Keep UI-set language formats across upgrades — base's res.lang.csv is a
      # noupdate-less data file that -u base replays. See DEPLOY.md.
      LANG_NOUPDATE: ${LANG_NOUPDATE:-1}
      DEBUG: ${DEBUG:-0}
      DEBUGPY_PORT: ${DEBUGPY_PORT:-5678}
      DEBUGPY_WAIT: ${DEBUGPY_WAIT:-}
      # --- Health probe (see platform/docker/healthcheck.py) ----------------
      # Leave HEALTHCHECK_HOST empty unless multi-db: the probe falls back to
      # DB_NAME, which satisfies a host-routed DBFILTER (%d is just the first
      # label of the Host, never resolved). Only DB_NAME=False needs it set.
      HEALTHCHECK_HOST: ${HEALTHCHECK_HOST:-}
      HEALTHCHECK_PATH: ${HEALTHCHECK_PATH:-/web/manifest.webmanifest}
      HEALTHCHECK_TIMEOUT: ${HEALTHCHECK_TIMEOUT:-10}
      HEALTHCHECK_DISABLE: ${HEALTHCHECK_DISABLE:-}
    volumes:
      - odoo-data:/var/lib/odoo
    # Containment, not tuning: LIMIT_MEMORY_SOFT is what keeps workers small, and
    # this is the wall for when that fails. Without it a leaking worker takes the
    # whole host down and the kernel OOM killer picks the victim — which may well
    # be another stack's postmaster rather than the process at fault.
    #
    # This, not the per-worker limits, is the number to reconcile with the host's
    # RAM: the cgroup counts each copy-on-write page shared between forked
    # workers exactly once, so real usage sits far below WORKERS * SOFT.
    # 3g comfortably holds WORKERS=2 + 1 cron for a large addons set. Watch
    # `docker stats` for a week before trimming it.
    deploy:
      resources:
        limits:
          memory: ${ODOO_MEM_LIMIT:-3g}
    expose:
      - "${HTTP_PORT:-8069}"
      - "${GEVENT_PORT:-8072}"
    # Probes a db-requiring (auth='public') route, so a broken registry reports
    # 404 and a broken ORM reports 500 instead of the false 200 that /web/health
    # and /web/login both return. See platform/docker/healthcheck.py for why.
    #
    # start_period must outlast the entrypoint's boot upgrade — failures inside
    # it are not counted, so an upgrade in progress never flaps the container.
    # The `-u all` fallback path can exceed even 5 minutes on a large database;
    # if that is normal for a deployment, raise HEALTHCHECK_START_PERIOD rather
    # than lowering it. An OPENUPGRADE boot runs two full `-u all` passes: set
    # HEALTHCHECK_START_PERIOD=900s (or more) for that deploy. Docker's
    # `timeout` must stay above HEALTHCHECK_TIMEOUT
    # (the script's own HTTP timeout) or the script is killed before it answers.
    healthcheck:
      test: ["CMD", "python3", "/usr/local/bin/odoo-healthcheck.py"]
      interval: ${HEALTHCHECK_INTERVAL:-30s}
      timeout: 15s
      retries: ${HEALTHCHECK_RETRIES:-3}
      start_period: ${HEALTHCHECK_START_PERIOD:-300s}
    # No `ports:` on purpose — behind Traefik/nginx the proxy reaches odoo over
    # the docker network. For an inner-VPN box with no proxy, opt in via
    # docker-compose.dangerously-expose-odoo.yml (see DEPLOY.md). A `ports:`
    # entry here would publish on EVERY deployment; there is no "off" value.
    # --- Dokploy / Traefik domain routing ------------------------------------
    # Easiest: leave these off and set the domain in the Dokploy UI
    #   (service: odoo, port: 8069). For workers>0, websockets need a 2nd route.
    # Or drive everything from ${DOMAIN} by uncommenting + joining the Traefik
    # network (see DEPLOY.md):
    #
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.odoo.rule=Host(`${DOMAIN}`)"
    #   - "traefik.http.routers.odoo.entrypoints=websecure"
    #   - "traefik.http.routers.odoo.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.odoo.loadbalancer.server.port=${HTTP_PORT:-8069}"
    #   - "traefik.http.routers.odoo-ws.rule=Host(`${DOMAIN}`) && PathPrefix(`/websocket`)"
    #   - "traefik.http.routers.odoo-ws.entrypoints=websecure"
    #   - "traefik.http.routers.odoo-ws.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.odoo-ws.loadbalancer.server.port=${GEVENT_PORT:-8072}"
    # networks: [default, dokploy-network]
    #
    # Multi-db stack: one router pair per host; with DBFILTER=(?i)^%d$
    # (subdomain == db name, any case) no extra labels are needed. Free-form
    # db names instead need dbfilter_from_header + a per-host headers
    # middleware — see DEPLOY.md "Host -> database routing".

  backup:
    <<: *backup
    restart: unless-stopped
    volumes:
      - odoo-data:/var/lib/odoo:ro     # the backup never writes to the filestore

  # Not started by `up` (profile `restore`). Run by hand; naming the service
  # in `run` selects its profile:
  #   docker compose run --rm -v /path/to/age-key.txt:/age-key.txt:ro \
  #     backup-restore <source_db> <stamp|latest> <target_db>
  backup-restore:
    <<: *backup
    profiles: ["restore"]
    entrypoint: ["/usr/local/bin/restore.sh"]
    volumes:
      - odoo-data:/var/lib/odoo

volumes:
  db-data:
  odoo-data:

# Uncomment when wiring Traefik labels above on Dokploy:
# networks:
#   dokploy-network:
#     external: true
